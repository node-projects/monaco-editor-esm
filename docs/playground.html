<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playground – @node-projects/monaco-editor-esm</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --accent: #58a6ff;
      --accent2: #3fb950;
      --text: #c9d1d9;
      --muted: #8b949e;
      --toolbar-h: 50px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* TOOLBAR */
    .toolbar {
      height: var(--toolbar-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0 1rem;
      flex-shrink: 0;
    }
    .toolbar .logo {
      font-weight: 700;
      font-size: .9rem;
      color: var(--text);
      text-decoration: none;
      white-space: nowrap;
    }
    .toolbar .logo span { color: var(--accent); }
    .toolbar .sep { width: 1px; height: 22px; background: var(--border); }
    .toolbar h1 { font-size: .9rem; font-weight: 600; color: var(--muted); white-space: nowrap; }
    .spacer { flex: 1; }
    .toolbar select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: .8rem;
    }
    .toolbar select:focus { outline: none; border-color: var(--accent); }
    .btn-run {
      display: inline-flex; align-items: center; gap: .4rem;
      background: var(--accent2);
      color: #0d1117;
      border: none;
      border-radius: 6px;
      padding: 5px 14px;
      font-size: .85rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .15s;
    }
    .btn-run:hover { opacity: .85; }
    .btn-home {
      color: var(--muted);
      text-decoration: none;
      font-size: .85rem;
      transition: color .15s;
    }
    .btn-home:hover { color: var(--text); }

    /* MAIN SPLIT */
    .split {
      display: flex;
      flex: 1;
      min-height: 0;
    }
    .pane {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
    }
    .pane-header {
      height: 34px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 .85rem;
      font-size: .78rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: .04em;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .pane-header .hint {
      margin-left: auto;
      font-size: .72rem;
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0;
      color: var(--muted);
      opacity: .7;
    }
    .divider {
      width: 5px;
      background: var(--border);
      cursor: col-resize;
      flex-shrink: 0;
      transition: background .15s;
    }
    .divider:hover, .divider.dragging { background: var(--accent); }
    .editor-wrap {
      flex: 1;
      position: relative;
      min-height: 0;
    }
    .editor-wrap > div {
      position: absolute;
      inset: 0;
    }

    /* PREVIEW PANE */
    .preview-pane {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
    }
    #preview-container {
      flex: 1;
      min-height: 0;
      position: relative;
      background: #1e1e1e; /* matches vs-dark */
    }
    #preview-editor {
      position: absolute;
      inset: 0;
    }

    /* ERROR BAR */
    #error-bar {
      display: none;
      background: #3a1a1a;
      border-top: 1px solid #6e2020;
      color: #f97583;
      font-family: monospace;
      font-size: .8rem;
      padding: 6px 1rem;
      flex-shrink: 0;
      white-space: pre-wrap;
      max-height: 80px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

<div class="toolbar">
  <a class="logo" href="index.html">@node-projects/<span>monaco-editor-esm</span></a>
  <div class="sep"></div>
  <h1>Playground</h1>
  <div class="spacer"></div>
  <label for="sample-select" style="font-size:.8rem;color:var(--muted)">Sample:</label>
  <select id="sample-select">
    <option value="default" selected>Default</option>
    <option value="webComponent">Web Component</option>
  </select>
  <div class="sep"></div>
  <label for="lang-select" style="font-size:.8rem;color:var(--muted)">Language:</label>
  <select id="lang-select">
    <option value="javascript" selected>JavaScript</option>
    <option value="typescript">TypeScript</option>
    <option value="html">HTML</option>
    <option value="css">CSS</option>
    <option value="json">JSON</option>
    <option value="python">Python</option>
    <option value="rust">Rust</option>
    <option value="go">Go</option>
    <option value="csharp">C#</option>
    <option value="cpp">C++</option>
    <option value="markdown">Markdown</option>
    <option value="sql">SQL</option>
  </select>
  <label for="theme-select" style="font-size:.8rem;color:var(--muted)">Theme:</label>
  <select id="theme-select">
    <option value="vs-dark" selected>Dark</option>
    <option value="vs">Light</option>
    <option value="hc-black">High Contrast Dark</option>
    <option value="hc-light">High Contrast Light</option>
  </select>
  <button class="btn-run" id="run-btn">▶ Run</button>
  <a class="btn-home" href="index.html">← Home</a>
</div>

<div class="split" id="split">
  <!-- LEFT: Code editor -->
  <div class="pane" id="left-pane">
    <div class="pane-header">
      Setup Code
      <span class="hint">Edit the code that creates the preview editor →</span>
    </div>
    <div class="editor-wrap">
      <div id="setup-editor"></div>
    </div>
  </div>

  <div class="divider" id="divider"></div>

  <!-- RIGHT: Preview pane -->
  <div class="preview-pane" id="right-pane">
    <div class="pane-header">
      Live Preview
      <span class="hint">The editor created by your setup code</span>
    </div>
    <div id="preview-container">
      <div id="preview-editor"></div>
    </div>
    <div id="error-bar"></div>
  </div>
</div>

<!--
  Load Monaco from unpkg CDN (this very package).
  We bootstrap the editor's CSS the same way a user would.
-->
<link
  rel="stylesheet"
  id="monaco-css"
  href="https://cdn.jsdelivr.net/npm/@node-projects/monaco-editor-esm@latest/min/vs/editor/editor.main.css"
/>

<script type="module">
// ─── CDN base ────────────────────────────────────────────────────────────────
const CDN = 'https://cdn.jsdelivr.net/npm/@node-projects/monaco-editor-esm@latest';
const MONACO_MAIN = `${CDN}/esm/vs/editor/editor.main.min.js`;

// ─── Workers: use a same-origin blob that imports the cross-origin worker ────
// Chrome/Firefox both allow module workers from blob: URLs that import() other
// origins, as long as the remote script is served with CORS headers (jsDelivr ✓).
function makeWorker(label) {
  const workerMap = {
    json:        'json.worker.js',
    css:         'css.worker.js',
    scss:        'css.worker.js',
    less:        'css.worker.js',
    html:        'html.worker.js',
    handlebars:  'html.worker.js',
    razor:       'html.worker.js',
    typescript:  'ts.worker.js',
    javascript:  'ts.worker.js',
  };
  const file = workerMap[label] ?? 'editor.worker.js';
  const url  = `${CDN}/esm/vs/editor/${file}`;
  const blob = new Blob([`import "${url}";`], { type: 'text/javascript' });
  return new Worker(URL.createObjectURL(blob), { type: 'module' });
}

self.MonacoEnvironment = { getWorker: (_id, label) => makeWorker(label) };

// ─── Default setup code ──────────────────────────────────────────────────────
// ─── Samples ─────────────────────────────────────────────────────────────────
const SAMPLES = {
  default: `\
// This code runs every time you click ▶ Run.
// The variable \`monaco\` is already available.
// Use \`container\` to target the preview pane's host element.

monaco.editor.create(container, {
  value: [
    '// Welcome to @node-projects/monaco-editor-esm',
    '',
    'function greet(name) {',
    '  return \`Hello, \${name}!\`;',
    '}',
    '',
    'console.log(greet("Monaco"));',
  ].join('\\n'),
  language: 'javascript',
  theme: 'vs-dark',
  automaticLayout: true,
  minimap: { enabled: false },
});
`,
  webComponent: `\
// Monaco Editor inside a Web Component (Shadow DOM)
// This demonstrates that @node-projects/monaco-editor-esm supports Shadow DOM.

const MONACO_CSS = 'https://cdn.jsdelivr.net/npm/@node-projects/monaco-editor-esm@latest/min/vs/editor/editor.main.css';

class MonacoEditorElement extends HTMLElement {
  constructor() {
    super();
    const shadow = this.attachShadow({ mode: 'open' });

    const style = document.createElement('style');
    style.textContent = ':host{display:block;width:100%;height:100%}#editor{width:100%;height:100%}';
    shadow.appendChild(style);

    // Add Monaco CSS inside the shadow root
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = MONACO_CSS;
    shadow.appendChild(link);

    // Editor host div
    const div = document.createElement('div');
    div.id = 'editor';
    shadow.appendChild(div);

    link.onload = () => {
      monaco.editor.create(div, {
        value: [
          '// Monaco Editor inside a Web Component!',
          '',
          'class Greeter {',
          '  greet(name) { return \`Hello, \${name}!\`; }',
          '}',
          '',
          'new Greeter().greet("Shadow DOM");',
        ].join('\\n'),
        language: 'javascript',
        theme: 'vs-dark',
        automaticLayout: true,
        minimap: { enabled: false },
      });
    };
  }
}

if (!customElements.get('monaco-editor-wc')) {
  customElements.define('monaco-editor-wc', MonacoEditorElement);
}

const el = document.createElement('monaco-editor-wc');
container.appendChild(el);
`,
};

const DEFAULT_CODE = SAMPLES.default;

// ─── Load Monaco once ────────────────────────────────────────────────────────
let monaco;
try {
  monaco = await import(MONACO_MAIN);
} catch (err) {
  document.getElementById('error-bar').style.display = 'block';
  document.getElementById('error-bar').textContent = 'Failed to load Monaco: ' + err;
  throw err;
}

// ─── Setup editor (left pane) ─────────────────────────────────────────────
const setupEditor = monaco.editor.create(
  document.getElementById('setup-editor'),
  {
    value: DEFAULT_CODE,
    language: 'javascript',
    theme: 'vs-dark',
    automaticLayout: true,
    minimap: { enabled: false },
    fontSize: 14,
    scrollBeyondLastLine: false,
  }
);

// ─── Code completion for monaco / container ───────────────────────────────
monaco.languages.typescript.javascriptDefaults.addExtraLib(`
declare const container: HTMLElement;
declare namespace monaco {
  namespace editor {
    function create(container: HTMLElement, options?: IStandaloneEditorConstructionOptions): IStandaloneCodeEditor;
    function setTheme(theme: string): void;
    function setModelLanguage(model: ITextModel, languageId: string): void;
    function getEditors(): ICodeEditor[];
    interface IStandaloneEditorConstructionOptions {
      value?: string;
      language?: string;
      theme?: string;
      automaticLayout?: boolean;
      minimap?: { enabled?: boolean; size?: 'proportional' | 'fill' | 'actual' };
      fontSize?: number;
      readOnly?: boolean;
      wordWrap?: 'off' | 'on' | 'wordWrapColumn' | 'bounded';
      lineNumbers?: 'on' | 'off' | 'relative' | 'interval';
      scrollBeyondLastLine?: boolean;
      folding?: boolean;
      glyphMargin?: boolean;
      tabSize?: number;
      insertSpaces?: boolean;
      renderWhitespace?: 'none' | 'boundary' | 'selection' | 'trailing' | 'all';
      renderLineHighlight?: 'none' | 'gutter' | 'line' | 'all';
      cursorStyle?: 'line' | 'block' | 'underline' | 'line-thin' | 'block-outline' | 'underline-thin';
      cursorBlinking?: 'blink' | 'smooth' | 'phase' | 'expand' | 'solid';
      scrollbar?: { vertical?: 'auto' | 'visible' | 'hidden'; horizontal?: 'auto' | 'visible' | 'hidden'; verticalScrollbarSize?: number; horizontalScrollbarSize?: number };
      suggest?: { showKeywords?: boolean; showSnippets?: boolean };
      quickSuggestions?: boolean | { other?: boolean; comments?: boolean; strings?: boolean };
      acceptSuggestionOnEnter?: 'on' | 'smart' | 'off';
      bracketPairColorization?: { enabled?: boolean };
      guides?: { bracketPairs?: boolean | 'active'; indentation?: boolean };
      padding?: { top?: number; bottom?: number };
      stickyScroll?: { enabled?: boolean };
      contextmenu?: boolean;
      smoothScrolling?: boolean;
      fontFamily?: string;
      fontLigatures?: boolean | string;
      fontWeight?: string;
      letterSpacing?: number;
      lineHeight?: number;
    }
    interface IStandaloneCodeEditor {
      getValue(): string;
      setValue(value: string): void;
      getModel(): ITextModel | null;
      dispose(): void;
      focus(): void;
      layout(dimension?: { width: number; height: number }): void;
      onDidChangeModelContent(listener: (e: any) => void): { dispose(): void };
    }
    interface ITextModel {
      getValue(): string;
      setValue(value: string): void;
      getLanguageId(): string;
      dispose(): void;
    }
    interface ICodeEditor extends IStandaloneCodeEditor {}
  }
  namespace languages {
    namespace typescript {
      const javascriptDefaults: { addExtraLib(content: string, filePath?: string): { dispose(): void }; setCompilerOptions(options: any): void };
      const typescriptDefaults: { addExtraLib(content: string, filePath?: string): { dispose(): void }; setCompilerOptions(options: any): void };
    }
    function register(language: { id: string }): void;
    function registerCompletionItemProvider(languageId: string, provider: any): { dispose(): void };
    function setMonarchTokensProvider(languageId: string, languageDef: any): { dispose(): void };
  }
  const KeyMod: { CtrlCmd: number; Shift: number; Alt: number; WinCtrl: number };
  const KeyCode: { [key: string]: number };
}
`, 'ts:monaco-playground.d.ts');

// ─── Language / Theme selectors ───────────────────────────────────────────
// ─── Sample selector ──────────────────────────────────────────────────────
document.getElementById('sample-select').addEventListener('change', (e) => {
  const sample = SAMPLES[e.target.value];
  if (sample) {
    setupEditor.setValue(sample);
    runSetupCode();
  }
});

document.getElementById('lang-select').addEventListener('change', (e) => {
  monaco.editor.setModelLanguage(setupEditor.getModel(), e.target.value);
});
document.getElementById('theme-select').addEventListener('change', (e) => {
  monaco.editor.setTheme(e.target.value);
});

// ─── Run / preview ────────────────────────────────────────────────────────
let previewEditorInstance = null;

function showError(msg) {
  const bar = document.getElementById('error-bar');
  bar.textContent = msg;
  bar.style.display = 'block';
}
function clearError() {
  const bar = document.getElementById('error-bar');
  bar.textContent = '';
  bar.style.display = 'none';
}

function runSetupCode() {
  clearError();

  // Dispose previous preview editor
  if (previewEditorInstance) {
    previewEditorInstance.dispose();
    previewEditorInstance = null;
  }

  const container = document.getElementById('preview-editor');
  // Clear the container
  container.innerHTML = '';

  const code = setupEditor.getValue();

  try {
    // Execute the user's setup code with `monaco` and `container` in scope.
    const fn = new Function('monaco', 'container', code); // eslint-disable-line no-new-func
    const result = fn(monaco, container);
    // If the user returned an editor, keep a reference for disposal.
    if (result && typeof result.dispose === 'function') {
      previewEditorInstance = result;
    } else {
      // Try to find newly created editor by querying monaco's editors list.
      const editors = monaco.editor.getEditors();
      for (const ed of editors) {
        if (ed !== setupEditor) {
          previewEditorInstance = ed;
          break;
        }
      }
    }
  } catch (err) {
    showError(String(err));
    console.error(err);
  }
}

document.getElementById('run-btn').addEventListener('click', runSetupCode);

// Ctrl+Enter / Cmd+Enter shortcut
window.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    runSetupCode();
  }
});

// Run once on load
runSetupCode();

// ─── Resizable divider ────────────────────────────────────────────────────
const divider = document.getElementById('divider');
const leftPane = document.getElementById('left-pane');
const rightPane = document.getElementById('right-pane');
const split = document.getElementById('split');

let dragging = false;
let startX = 0;
let startLeftW = 0;

divider.addEventListener('mousedown', (e) => {
  dragging = true;
  startX = e.clientX;
  startLeftW = leftPane.getBoundingClientRect().width;
  divider.classList.add('dragging');
  document.body.style.userSelect = 'none';
  document.body.style.cursor = 'col-resize';
});

window.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  const totalW = split.getBoundingClientRect().width - divider.offsetWidth;
  const delta = e.clientX - startX;
  const newLeft = Math.min(Math.max(startLeftW + delta, 200), totalW - 200);
  leftPane.style.flex = 'none';
  leftPane.style.width = newLeft + 'px';
  rightPane.style.flex = '1';
});

window.addEventListener('mouseup', () => {
  if (dragging) {
    dragging = false;
    divider.classList.remove('dragging');
    document.body.style.userSelect = '';
    document.body.style.cursor = '';
  }
});
</script>
</body>
</html>
